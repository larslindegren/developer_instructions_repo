<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Tracker App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Wellness Tracker</h1>
            <p>Track your daily wellness activities</p>
        </header>

        <main class="main-content">
            <!-- Dashboard Section -->
            <section class="dashboard">
                <h2>Today's Progress</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">💧</div>
                        <h3>Water Intake</h3>
                        <p class="stat-value" id="water-value">0 / 8</p>
                        <p class="stat-label">glasses</p>
                        <button class="btn-primary" onclick="incrementWater()">Add Glass</button>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🏃</div>
                        <h3>Steps</h3>
                        <p class="stat-value" id="steps-value">0 / 10,000</p>
                        <p class="stat-label">steps</p>
                        <button class="btn-primary" onclick="openModal('steps')">Log Steps</button>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🧘</div>
                        <h3>Meditation</h3>
                        <p class="stat-value" id="meditation-value">0 / 30</p>
                        <p class="stat-label">minutes</p>
                        <button class="btn-primary" onclick="openModal('meditation')">Log Time</button>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">😴</div>
                        <h3>Sleep</h3>
                        <p class="stat-value" id="sleep-value">0 / 8</p>
                        <p class="stat-label">hours</p>
                        <button class="btn-primary" onclick="openModal('sleep')">Log Sleep</button>
                    </div>
                </div>
            </section>

            <!-- Activity Log Section -->
            <section class="activity-log">
                <h2>Recent Activities</h2>
                <div id="activity-list" class="activity-list">
                    <p class="empty-state">No activities logged yet. Start tracking your wellness!</p>
                </div>
            </section>
        </main>

        <!-- Modal for logging activities -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2 id="modal-title">Log Activity</h2>
                <div class="modal-body">
                    <label for="activity-input">Enter value:</label>
                    <input type="number" id="activity-input" class="input-field" placeholder="0">
                    <button class="btn-primary" onclick="logActivity()">Save</button>
                    <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
